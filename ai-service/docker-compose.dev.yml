# docker compose -f docker-compose.dev.yml up -d --build
services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-service-dev
    ports:
      - "8000:8000"
    networks:
      - mangarec-network
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
    volumes:
      # Mount entire source code for hot-reloading
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-dev
    ports:
      - "6333:6333"
    networks:
      - mangarec-network
    volumes:
      - qdrant_data_dev:/qdrant/storage

networks:
  mangarec-network:
    name: mangarec_global_network
    external: true

volumes:
  qdrant_data_dev:
