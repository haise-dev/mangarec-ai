version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangarec-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=sqlite:////app/data/manga_metadata.db
    depends_on:
      - qdrant
    volumes:
      # Bind mount for SQLite data persistence (AC-1, AC-3)
      - ./data:/app/data
      # Mount the local cache so model is persistent across runs if developing
      - hf-cache:/app/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mangarec-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
  hf-cache:
