[project]
name = "mangarec-ai"
version = "0.1.0"
description = "AI Recommendation Service for MangaRec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langgraph>=1.2.4",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "qdrant-client>=1.18.0",
    "ruff>=0.15.16",
    "uvicorn>=0.49.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
