[project]
name = "mangarec-ai"
version = "0.1.0"
description = "AI Recommendation Service for MangaRec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.4",
    "langsmith>=0.8.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
    "sqlalchemy>=2.0",
    "torch>=2.12.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Force CPU-only PyTorch — eliminates ~2.5 GB of NVIDIA/CUDA downloads.
torch-backend = "cpu"

# Explicit CPU-only PyTorch index (fallback if torch-backend is ignored)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
