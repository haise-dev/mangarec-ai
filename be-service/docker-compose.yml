services:
  postgres:
    image: postgres:16-alpine
    container_name: mangarec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mangarec}
      POSTGRES_USER: ${POSTGRES_USER:-mangarec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangarec_password}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mangarec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flyway:
    image: flyway/flyway:10-alpine
    container_name: mangarec-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mangarec}
      - -user=${POSTGRES_USER:-mangarec}
      - -password=${POSTGRES_PASSWORD:-mangarec_password}
      - -schemas=mangarec
      - -defaultSchema=mangarec
      - -connectRetries=60
      - migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

  redis:
    image: redis:7-alpine
    container_name: mangarec-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mangarec_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mangarec_postgres_data:
  mangarec_redis_data:
