server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: mangarec-be

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mangarec?currentSchema=mangarec}
    username: ${SPRING_DATASOURCE_USERNAME:mangarec}
    password: ${SPRING_DATASOURCE_PASSWORD:mangarec_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: mangarec
    default-schema: mangarec
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: mangarec
        jdbc:
          time_zone: UTC

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: ${OPENAPI_DOCS:mangarec}
    server: ${OPENAPI_SERVER:http://localhost:${server.port}}
    title: ${OPENAPI_TITLE:MangaRec Backend API}
    version: ${OPENAPI_VERSION:1.0.0}

jwt:
  expiryMinutes: ${JWT_EXPIRY_MINUTES:60}
  expiryDay: ${JWT_EXPIRY_DAY:14}
  accessKey: ${JWT_ACCESS_KEY:4EL1miEw6QltfOwjs3qYfIctGOjynm3UhrFnicj7mp8=}
  refreshKey: ${JWT_REFRESH_KEY:58DrWQsRoCA7YLSb5rnrgQkMa1xZ/+w2lL4iZoSQxuY=}

google:
  auth:
    client-id: ${GOOGLE_AUTH_CLIENT_ID:}

auth:
  password-reset:
    otp-expiry-minutes: ${PASSWORD_RESET_OTP_EXPIRY_MINUTES:10}
